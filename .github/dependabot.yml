# Library updates as pull requests, once a month and grouped, so CI minutes stay low. Security
# fixes for vulnerable libraries still arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Major versions (TypeScript 6, React 20, …) are planned upgrades, not automatic ones.
    # @types/node follows the Node version the app runs on (24, .nvmrc).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
