# Every pull request and every push to main runs the same checks as the laptop
# (docs/TESTING.md). Each job starts its own throwaway Supabase inside GitHub's runner, so CI
# never needs or sees a real key, password or customer. Branch protection requires
# "CI passed", the last job, before anything can merge into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Only docs changed → skip the slow jobs (they count as passed).
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!legal/**'

  secrets:
    name: No keys or passwords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not just the latest commit
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Files in this commit (scripts/check-secrets.mjs)
        run: node scripts/check-secrets.mjs
      - name: Whole history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact

  quality:
    name: Lint, types, formatting, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Known vulnerabilities in the app's own libraries
        run: pnpm audit --prod --audit-level high

  database:
    name: Unit and database tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          supabase: "true"
      - run: pnpm test
      - name: Database types match the migrations
        run: |
          pnpm exec supabase gen types typescript --local > src/types/database.ts
          pnpm exec prettier --write src/types/database.ts
          git diff --exit-code src/types/database.ts || {
            echo "::error::src/types/database.ts is out of date: run pnpm db:types and commit it"
            exit 1
          }

  e2e:
    name: Browser tests · ${{ matrix.project }}
    needs: [changes, quality]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: "iPhone SE", browser: webkit }
          - { project: "iPhone 15 Pro", browser: webkit }
          - { project: "Pixel 7", browser: chromium }
          - { project: "Galaxy S9+", browser: chromium }
          - { project: "iPad (gen 7)", browser: webkit }
          - { project: "iPad (gen 7) landscape", browser: webkit }
          - { project: "Desktop Chrome", browser: chromium }
          - { project: "Desktop Safari", browser: webkit }
          - { project: "Desktop Firefox", browser: firefox }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          supabase: "true"
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end and accessibility
        run: pnpm exec playwright test --project="${{ matrix.project }}"
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  production:
    name: Production build, guards and Lighthouse
    needs: [changes, quality]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          supabase: "true"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production guards and performance budgets
        run: pnpm e2e:prod
      - name: Lighthouse (speed ≥ 90, accessibility 100, best practices ≥ 95)
        run: pnpm lighthouse
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  # The one check branch protection requires: green only when every job above passed (or was
  # skipped because only docs changed).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, secrets, quality, database, e2e, production]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled"
          exit 1
      - run: echo "All checks passed"
