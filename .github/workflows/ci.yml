# Every pull request and every push to main runs the quick checks: no secrets, lint, types,
# formatting, unit and database tests. The 9-device browser tests and the production build with
# Lighthouse run only when started by hand (Actions → CI → Run workflow), to stay inside the
# free Actions minutes; day to day they run on the laptop with `pnpm test:all` (docs/TESTING.md). Each job starts its own throwaway Supabase inside GitHub's runner, so CI
# never needs or sees a real key, password or customer. Branch protection requires
# "CI passed", the last job, before anything can merge into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # On pull requests the filter asks GitHub for the list of changed files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Only docs changed → skip the slow jobs (they count as passed).
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!legal/**'
      # A manual run tests all 9 devices (the browser jobs only run then). Safari's engine is
      # heavy on Linux: one browser at a time, or the dev server starves.
      - id: devices
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = "true" ]; then
            devices=$(jq -c . <<'JSON'
          [
            {"project": "iPhone SE", "browser": "webkit", "workers": 1},
            {"project": "iPhone 15 Pro", "browser": "webkit", "workers": 1},
            {"project": "Pixel 7", "browser": "chromium", "workers": 2},
            {"project": "Galaxy S9+", "browser": "chromium", "workers": 2},
            {"project": "iPad (gen 7)", "browser": "webkit", "workers": 1},
            {"project": "iPad (gen 7) landscape", "browser": "webkit", "workers": 1},
            {"project": "Desktop Chrome", "browser": "chromium", "workers": 2},
            {"project": "Desktop Safari", "browser": "webkit", "workers": 1},
            {"project": "Desktop Firefox", "browser": "firefox", "workers": 2}
          ]
          JSON
            )
          else
            devices='[{"project": "Desktop Chrome", "browser": "chromium", "workers": 2}]'
          fi
          echo "devices=$devices" >> "$GITHUB_OUTPUT"

  secrets:
    name: No keys or passwords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, not just the latest commit
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Files in this commit (scripts/check-secrets.mjs)
        run: node scripts/check-secrets.mjs
      - name: Whole history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact

  quality:
    name: Lint, types, formatting, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Known vulnerabilities in the app's own libraries
        run: pnpm audit --prod --audit-level high

  database:
    name: Unit and database tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          supabase: "true"
      - run: pnpm test
      - name: Database types match the migrations
        run: |
          pnpm exec supabase gen types typescript --local > src/types/database.ts
          pnpm exec prettier --write src/types/database.ts
          git diff --exit-code src/types/database.ts || {
            echo "::error::src/types/database.ts is out of date: run pnpm db:types and commit it"
            exit 1
          }

  e2e:
    name: Browser tests · ${{ matrix.project }}
    needs: [changes, quality]
    if: needs.changes.outputs.app == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          supabase: "true"
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end and accessibility
        run: pnpm exec playwright test --project="${{ matrix.project }}" --workers=${{ matrix.workers }}
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  production:
    name: Production build, guards and Lighthouse
    needs: [changes, quality]
    if: needs.changes.outputs.app == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          supabase: "true"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production guards and performance budgets
        run: pnpm e2e:prod
      - name: Lighthouse (speed ≥ 90, accessibility 100, best practices ≥ 95)
        run: pnpm lighthouse
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  # The one check branch protection requires: green only when every job above passed (or was
  # skipped: only docs changed, or the browser and Lighthouse jobs on an automatic run).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, secrets, quality, database, e2e, production]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled"
          exit 1
      - run: echo "All checks passed"
